name: Build and deploy Equity Terminal

# Two things this workflow now does that its predecessor did not:
#   1. Runs on a schedule. The previous version only fired on push, so the job named
#      "nightly" had never once run nightly.
#   2. Refuses to publish a degenerate ledger. The previous version deployed a board
#      on which all 48 names scored 0 and reported success, because nothing inspected
#      the output. scripts/validate_ledger.py is now a hard gate between build and deploy.

on:
  push:
    branches: ["master"]
  schedule:
    # 23:00 UTC on weekdays — comfortably after the US close in both EST and EDT.
    - cron: "0 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write      # the data job commits the refreshed ledger back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ledger_ok: ${{ steps.validate.outcome }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # A push must deploy the committed ledger, never rebuild it. US markets are shut
      # at the weekend, so a Saturday merge produced a snapshot carrying Friday's
      # closes — 2026-08-08 and 2026-08-09 are byte-for-byte the same board. That fed
      # the watchlist two identical days (reported, correctly, as 1,016 names unchanged
      # and zero movement, which reads exactly like a broken change feed) and handed
      # the alpha curve zero-return legs on days when nothing traded.
      - name: Build ledger (Nasdaq/Yahoo prices + SEC XBRL fundamentals)
        if: github.event_name != 'push'
        env:
          # SEC's fair-access policy rejects requests without a contact address.
          # Set SEC_CONTACT as a repository secret to an address you monitor.
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          # Without this the progress and coverage lines are buffered and only appear
          # if the job succeeds — exactly when you least need them.
          PYTHONUNBUFFERED: "1"
        run: python -m equity_monitor.nightly

      # Runs on a push too, against the committed ledger. The build above is skipped
      # there, so this is validating what is about to deploy rather than what was just
      # produced — which is the thing that actually matters to a visitor.
      - name: Validate ledger
        id: validate
        run: |
          # Compare coverage against the previously published ledger, which is still
          # in git HEAD at this point — the build overwrote the working copy only.
          git show HEAD:ledger/index.json > /tmp/previous_ledger.json 2>/dev/null || true
          python scripts/validate_ledger.py ledger/index.json \
                 --previous /tmp/previous_ledger.json

      - name: Mirror terminal into docs/
        run: |
          cp web/terminal.html docs/terminal.html

      - name: Commit refreshed data
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ledger/snapshots/ IS committed: it is the research dataset, and an
          # Information Coefficient cannot be computed retroactively — the day's
          # factor decomposition is either recorded tonight or lost. ~200 KB/day.
          # ledger/history/ and ledger/factors/ are gitignored: both are regenerated
          # each run and shipped in the Pages artifact instead.
          # performance.json is listed explicitly for the same reason as snapshots:
          # the terminal fetches it by name, and a file that is written but never
          # committed 404s on the deployed site behind a silent catch — the alpha
          # curve then shows its "awaiting baseline" empty state forever, which looks
          # exactly like honest patience rather than a missing file.
          git add ledger/index.json ledger/history.json ledger/macro.json \
                  ledger/trends.json ledger/monitor.json ledger/watchlist.json \
                  ledger/performance.json ledger/edge.json ledger/health.json \
                  ledger/snapshots \
                  docs/terminal.html
          if git diff --cached --quiet; then
            echo "no data changes to commit"
          else
            git commit -m "data: nightly ledger refresh [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Assemble site
        run: |
          mkdir -p site/web site/ledger site/docs
          cp web/terminal.html      site/web/
          cp ledger/index.json      site/ledger/
          cp ledger/history.json    site/ledger/
          cp ledger/macro.json      site/ledger/ 2>/dev/null || true
          cp ledger/trends.json     site/ledger/ 2>/dev/null || true
          cp ledger/monitor.json    site/ledger/ 2>/dev/null || true
          cp ledger/watchlist.json  site/ledger/ 2>/dev/null || true
          cp ledger/performance.json site/ledger/ 2>/dev/null || true
          cp ledger/edge.json       site/ledger/ 2>/dev/null || true
          cp ledger/health.json     site/ledger/ 2>/dev/null || true
          cp -r ledger/history      site/ledger/ 2>/dev/null || true
          cp -r ledger/factors      site/ledger/ 2>/dev/null || true
          cp -r ledger/snapshots    site/ledger/ 2>/dev/null || true
          cp docs/methodology.html  site/docs/
          cat > site/index.html <<'HTML'
          <!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0;url=web/terminal.html">
          <title>Equity Conviction Monitor</title></head>
          <body><p>Loading <a href="web/terminal.html">Equity Conviction Monitor</a>…</p></body></html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
