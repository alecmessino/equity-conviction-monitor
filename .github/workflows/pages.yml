name: Deploy Equity Terminal to GitHub Pages

# Pages serves a static site built from web/ + ledger/ + docs/. The terminal
# fetches ../ledger/index.json relative to /web/, so the artifact must contain
# both web/ and ledger/ at the served root. A small build step assembles them.

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Live data pull (Yahoo keyless + Alpha Vantage fundamentals)
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          python -m equity_monitor.nightly
          echo "--- nightly exit: $? ---"
          python -c "import json;d=json.load(open('ledger/index.json'));print('LEDGER live=',d.get('live'),'rows=',len(d.get('all',[])))"
      - name: Assemble site
        run: |
          mkdir -p site/web site/ledger site/docs
          cp web/terminal.html site/web/
          cp ledger/index.json site/ledger/
          cp docs/methodology.html site/docs/
          cat > site/index.html <<'EOF'
          <!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0;url=web/terminal.html">
          <title>Equity Conviction Monitor</title></head>
          <body><p>Loading <a href="web/terminal.html">Equity Conviction Monitor</a>…</p></body></html>
          EOF
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
